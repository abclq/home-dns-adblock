name: 同步上游广告规则

# 云上定时跑：拉别人的社区规则 → 过白名单 → 提交进仓库
# 本机只需定期 git pull，就能拿到最新规则
on:
  schedule:
    # 每天 UTC 20:00 = 北京时间 04:00（家里网络空闲时段）
    - cron: "0 20 * * *"
  workflow_dispatch:      # 也支持手动点按钮跑

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 同步上游规则（白名单过滤）
        run: python3 scripts/sync_upstream.py

      - name: 检查是否有变化
        id: diff
        run: |
          if git diff --quiet -- config/adblock-upstream.conf dist/upstream-domains.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游无变化，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到变化："
            git diff --stat -- config/adblock-upstream.conf dist/upstream-domains.txt
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/adblock-upstream.conf dist/upstream-domains.txt
          N=$(grep -c '^address=' config/adblock-upstream.conf || echo 0)
          git commit -m "chore(upstream): 上游规则同步 $(date -u '+%Y-%m-%d') —— ${N} 条（已过白名单）"
          git push
