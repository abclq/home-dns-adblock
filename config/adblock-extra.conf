# ---------- ① DoH 加固：强制 App 回落到本机 DNS ----------
# 日志实测 19:14:02 出现（来源手机 100.112.84.3）
# App 走加密 DNS 时解析完全不经过本机 → 拦不住也看不见
# 拦掉后 App 会回落到系统 DNS（= 本机 dnsmasq），拦截覆盖面变大
