# ---------- ⑥ 红果短剧实测补漏（2026-10-14 16:46）----------
# 来源：红果短剧 3 小时抓包（ARP MITM）逐条比对规则库
# ⚠️ 勘误（2026-10-14 17:20 复核）：② 段的 -hl 并非「误写」——公网实测
#    log5-applog-hl.fqnovel.com 真能解析（且非泛解析），是有效规则，保留不删。
#    真实情况：抓包里 App 请求的是 -lf 系，规则里只有 -hl → 属「漏拦」，此处补齐 -lf 系。
address=/comfylink.com/    # 广告 SDK comfylink 整后缀
address=/ndcpp.com/    # 广告 SDK ndcpp 整后缀
address=/abtest3-misc-hl.zijieapi.com/    # 字节 AB 实验上报
address=/thanos.zijieapi.com/    # 字节监控上报
address=/mon.zijieapi.com/    # 字节监控上报
address=/timon.zijieapi.com/    # 字节监控上报
address=/feedback-c.zijieapi.com/    # 字节反馈上报
address=/tracker.xiaomixiaoai.com/    # 小米小爱追踪
address=/ad-sign.byteimg.com/    # 字节广告签名接口（主配置只列了 p3/p6/p9）
address=/aeventlog.beacon.qq.com/    # 腾讯埋点

# ⚠️ 修正：dnsmasq 的 address=/x/ 只在「标签边界」匹配，
#    applog-lf.fqnovel.com 跨了标签(- 不是 .)，所以 log5-applog-lf.fqnovel.com 匹配不上 → 必须列全域名
address=/log5-applog-lf.fqnovel.com/
address=/log3-applog-lf.fqnovel.com/
address=/rtlog5-applog-lf.fqnovel.com/
address=/rtlog3-applog-lf.fqnovel.com/
address=/mon11-misc-lf.fqnovel.com/
address=/mon3-misc-lf.fqnovel.com/

