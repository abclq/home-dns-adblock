# ============================================================
# 手工精挑补充规则（2026-10-05 添加）
# 来源：本机 dnsmasq 实测日志分析（queries.log 238,094 行 / 1,991 个唯一域名）
# 加规则原则：只取「上报 / 统计 / 追踪」类
#            绝不碰「播放 / 支付 / 定位 / 系统服务 / 云基础设施」
# ============================================================

# ---------- ① DoH 加固：强制 App 回落到本机 DNS ----------
# 日志实测 19:14:02 出现（来源手机 100.112.84.3）
# App 走加密 DNS 时解析完全不经过本机 → 拦不住也看不见
# 拦掉后 App 会回落到系统 DNS（= 本机 dnsmasq），拦截覆盖面变大
address=/doh.pub/
address=/dns.alidns.com/
address=/_dns.resolver.arpa/

